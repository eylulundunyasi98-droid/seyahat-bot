name: Fiyat Kontrolü

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Worker cron
        run: |
          curl -X GET "https://seyahat-bot.eylulundunyasi98.workers.dev/cron?type=alerts" \
            -H "Authorization: Bearer ${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            --fail --show-error || echo "Cron trigger failed, worker may use native Cloudflare cron instead"

      - name: Checkout (opsiyonel - log için)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run local price check fallback
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: https://seyahat-bot.eylulundunyasi98.workers.dev
        run: |
          echo "GitHub Actions cron completed. Asıl fiyat kontrolü Cloudflare Cron Trigger ile yapılır (0 */6 * * *)."
          echo "Worker sağlık kontrolü:"
          curl -s https://seyahat-bot.eylulundunyasi98.workers.dev/health | cat
